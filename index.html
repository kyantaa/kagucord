<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kyanta — Portfolio</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #100f16;
    --bg-soft: #18161f;
    --panel: #1d1a26;
    --panel-hover: #241f30;
    --line: #322d40;
    --line-soft: #262233;
    --ink: #f3efe8;
    --ink-dim: #a39cb0;
    --gold: #cc9a4d;
    --gold-soft: #e8c07f;
    --rose: #d4899a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 10% -10%, rgba(204,154,77,0.12), transparent 55%),
      radial-gradient(ellipse 700px 500px at 95% 5%, rgba(212,137,154,0.10), transparent 50%),
      radial-gradient(ellipse 800px 600px at 50% 110%, rgba(204,154,77,0.06), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    font-weight:300;
    line-height:1.75;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  ::selection{background:var(--gold); color:#1a1220;}
  .wrap{max-width:920px; margin:0 auto; padding:0 24px;}

  .top{
    padding:20px 0;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line-soft);
    position:sticky; top:0; z-index:20;
    backdrop-filter:blur(10px);
    background:rgba(16,15,22,0.72);
  }
  .top .mark{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px; letter-spacing:0.18em;
    color:var(--ink-dim);
    text-transform:uppercase;
  }
  .top .mark b{color:var(--gold-soft); font-weight:500; letter-spacing:0.02em;}

  .hero{
    padding:76px 0 60px;
    display:grid;
    grid-template-columns:190px 1fr;
    gap:48px;
    align-items:center;
    border-bottom:1px solid var(--line-soft);
    position:relative;
  }
  .avatar-box{
    width:190px; height:190px; border-radius:50%;
    background:linear-gradient(150deg, var(--panel), var(--bg-soft));
    border:1px solid var(--line);
    box-shadow:0 0 0 6px rgba(204,154,77,0.05), 0 20px 45px -20px rgba(0,0,0,0.6);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    overflow:hidden;
    transition:box-shadow .3s ease;
  }
  .avatar-box:hover{box-shadow:0 0 0 8px rgba(204,154,77,0.09), 0 20px 45px -20px rgba(0,0,0,0.7);}
  .avatar-box img{width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
  .avatar-box{animation:breathe 5.5s ease-in-out infinite;}
  @keyframes breathe{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.025); }
  }

  .hero-text .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; letter-spacing:0.22em;
    color:var(--rose); text-transform:uppercase;
    margin-bottom:12px;
    display:flex; align-items:center; gap:8px;
  }
  .hero-text .eyebrow::before{
    content:''; width:18px; height:1px; background:var(--rose); display:inline-block;
  }
  .hero-text h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:54px;
    color:var(--ink);
    letter-spacing:0.01em;
    line-height:1.15;
    background:linear-gradient(120deg, var(--ink) 40%, var(--gold-soft));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .hero-text h1 small{
    display:block;
    font-family:'Noto Sans JP', sans-serif;
    font-weight:300;
    font-size:16px;
    color:var(--ink-dim);
    margin-top:10px;
    letter-spacing:0.05em;
    -webkit-text-fill-color:var(--ink-dim);
  }
  .tagline{margin-top:20px; max-width:480px; color:var(--ink-dim); font-size:15px;}
  .tags{margin-top:24px; display:flex; flex-wrap:wrap; gap:9px;}
  .tag{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    padding:7px 13px;
    border:1px solid var(--line);
    border-radius:999px;
    color:var(--ink-dim);
    letter-spacing:0.05em;
    background:var(--bg-soft);
    transition:border-color .2s ease, color .2s ease, transform .2s ease;
  }
  .tag:hover{border-color:var(--gold-soft); color:var(--gold-soft); transform:translateY(-1px);}

  .chapter-head{display:flex; align-items:baseline; gap:16px; margin:72px 0 30px;}
  .chapter-head .no{
    font-family:'Shippori Mincho', serif;
    font-size:13px; color:var(--gold-soft); letter-spacing:0.12em; white-space:nowrap;
  }
  .chapter-head h2{font-family:'Shippori Mincho', serif; font-weight:500; font-size:23px; color:var(--ink);}
  .chapter-head .rule{flex:1; height:1px; background:linear-gradient(90deg, var(--line), transparent);}

  .tab-nav{display:flex; gap:10px; margin-bottom:28px; flex-wrap:wrap;}
  .tab-btn{
    padding:10px 22px; border:1px solid var(--line); border-radius:999px;
    background:var(--panel); color:var(--ink-dim);
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.06em;
    cursor:pointer; transition:all .2s ease;
  }
  .tab-btn:hover{border-color:var(--gold-soft); color:var(--ink); background:var(--panel-hover);}
  .tab-btn.active{background:linear-gradient(120deg, var(--gold-soft), var(--gold)); border-color:var(--gold-soft); color:#20140a; font-weight:500;}
  .tab-panel{display:none; animation:fadeIn .35s ease;}
  .tab-panel.active{display:block;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .gallery{column-count:3; column-gap:16px;}
  .gallery-item{
    break-inside:avoid; margin-bottom:16px; width:100%;
    background:linear-gradient(160deg, var(--panel), var(--bg-soft));
    border:1px solid var(--line); border-radius:10px;
    position:relative; overflow:hidden;
    transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .gallery-item:hover{
    transform:translateY(-4px);
    border-color:var(--gold);
    box-shadow:0 16px 32px -18px rgba(0,0,0,0.65);
  }
  .gallery-item.placeholder{
    aspect-ratio:3/4; display:flex; align-items:center; justify-content:center;
  }
  .gallery-item.photo img{display:block; width:100%; height:auto; transition:transform .4s ease;}
  .gallery-item.photo:hover img{transform:scale(1.04);}
  .gallery-item .ph{
    font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ink-dim);
    text-align:center; padding:0 14px; letter-spacing:0.05em;
  }
  .gallery-item .ph b{display:block; color:var(--gold-soft); font-size:11px; margin-bottom:4px;}
  .gallery-cap{
    padding:9px 12px;
    font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ink-dim);
    border-top:1px solid var(--line);
    letter-spacing:0.03em;
  }

  .site-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .site-card{
    display:block; border:1px solid var(--line); border-radius:12px; overflow:hidden;
    background:var(--panel); transition:border-color .25s ease, transform .25s ease, box-shadow .25s ease;
  }
  .site-card:hover{border-color:var(--gold); transform:translateY(-4px); box-shadow:0 18px 34px -20px rgba(0,0,0,0.65);}
  .browser-bar{display:flex; align-items:center; gap:5px; padding:10px 12px; background:var(--bg-soft); border-bottom:1px solid var(--line);}
  .browser-bar .dot{width:7px; height:7px; border-radius:50%; background:var(--line);}
  .browser-bar .dot:nth-child(1){background:#e0605a;}
  .browser-bar .dot:nth-child(2){background:#e0b95a;}
  .browser-bar .dot:nth-child(3){background:#6bbf7a;}
  .browser-bar .url{
    font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ink-dim);
    margin-left:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .site-preview{aspect-ratio:16/9; position:relative; overflow:hidden; background:var(--bg-soft);}
  .site-preview img{width:100%; height:100%; object-fit:cover; object-position:top; position:absolute; inset:0; transition:transform .4s ease;}
  .site-card:hover .site-preview img{transform:scale(1.05);}
  .site-info{padding:16px 18px;}
  .site-info h3{font-family:'Shippori Mincho', serif; font-size:15.5px; color:var(--ink);}
  .site-info p{font-size:12px; color:var(--ink-dim); margin-top:5px;}

  .worklist{display:flex; flex-direction:column;}
  .work{display:grid; grid-template-columns:1fr auto; gap:6px 24px; align-items:start; padding:22px 4px; border-bottom:1px solid var(--line-soft); border-radius:8px; transition:background .2s ease;}
  .work:hover{background:rgba(255,255,255,0.02);}
  .work:last-child{border-bottom:none;}
  .work h3{font-family:'Shippori Mincho', serif; font-weight:500; font-size:17.5px; color:var(--ink);}
  .work p{grid-column:1; color:var(--ink-dim); font-size:13.5px; max-width:520px;}
  .work .role{
    grid-column:2; grid-row:1 / span 2;
    font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--rose);
    letter-spacing:0.06em; text-align:right; align-self:start; padding-top:4px; white-space:nowrap;
  }

  .links{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .link-card{
    border:1px solid var(--line); border-radius:10px; padding:20px 22px;
    background:var(--panel); transition:border-color .2s ease, transform .2s ease, background .2s ease;
    display:block; position:relative; overflow:hidden;
  }
  .link-card::after{
    content:'→'; position:absolute; right:20px; top:20px; color:var(--gold-soft);
    opacity:0; transform:translateX(-6px); transition:all .2s ease; font-family:'JetBrains Mono', monospace;
  }
  .link-card:hover{border-color:var(--gold); transform:translateY(-3px); background:var(--panel-hover);}
  .link-card:hover::after{opacity:1; transform:translateX(0);}
  .link-card .platform{font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ink-dim); letter-spacing:0.14em; text-transform:uppercase;}
  .link-card .handle{font-family:'Shippori Mincho', serif; font-size:16.5px; margin-top:7px; color:var(--ink);}
  .link-card .desc{font-size:12.5px; color:var(--ink-dim); margin-top:5px;}

  footer{
    margin-top:90px; padding:34px 0 64px; border-top:1px solid var(--line-soft);
    display:flex; justify-content:space-between; align-items:center;
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-dim); letter-spacing:0.06em;
  }

  @media (max-width:640px){
    .hero{grid-template-columns:1fr; text-align:center; justify-items:center; padding:56px 0 44px;}
    .hero-text .eyebrow{justify-content:center;}
    .hero-text .tags{justify-content:center;}
    .tags{justify-content:center;}
    .gallery{column-count:2;}
    .site-grid{grid-template-columns:1fr;}
    .links{grid-template-columns:1fr;}
    .hero-text h1{font-size:36px;}
    .work{grid-template-columns:1fr;}
    .work .role{grid-column:1; grid-row:auto; text-align:left; padding-top:2px;}
  }
  /* ===== Loader + Gate ===== */
  #site-loader{
    position:fixed; inset:0; z-index:999;
    background:
      radial-gradient(ellipse 900px 500px at 10% -10%, rgba(204,154,77,0.14), transparent 55%),
      radial-gradient(ellipse 700px 500px at 95% 5%, rgba(212,137,154,0.12), transparent 50%),
      var(--bg);
    display:flex; align-items:center; justify-content:center;
    transition:opacity .7s ease, visibility .7s ease;
  }
  #site-loader.hide{opacity:0; visibility:hidden; pointer-events:none;}
  .loader-inner{text-align:center;}
  .loader-mark{
    font-family:'Shippori Mincho', serif; font-weight:700;
    font-size:26px; letter-spacing:0.08em; color:var(--gold-soft);
    margin-bottom:22px; opacity:0.95;
  }
  .loader-ring{
    width:56px; height:56px; margin:0 auto 22px;
    border-radius:50%;
    border:2px solid var(--line);
    border-top-color:var(--gold-soft);
    border-right-color:var(--rose);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loader-bar{
    width:180px; height:2px; margin:0 auto;
    background:var(--line-soft); border-radius:2px; overflow:hidden;
  }
  .loader-bar::after{
    content:''; display:block; height:100%; width:40%;
    background:linear-gradient(90deg, var(--gold), var(--gold-soft), var(--rose));
    animation:loaderslide 1.1s ease-in-out infinite;
  }
  @keyframes loaderslide{
    0%{ transform:translateX(-120%); }
    100%{ transform:translateX(280%); }
  }
  .loader-sub{
    margin-top:16px; font-family:'JetBrains Mono', monospace;
    font-size:10.5px; letter-spacing:0.18em; color:var(--ink-dim);
    text-transform:uppercase;
  }



  /* ===== Scroll reveal ===== */
  .reveal{
    opacity:0; transform:translateY(26px);
    transition:opacity .75s cubic-bezier(.2,.7,.2,1), transform .75s cubic-bezier(.2,.7,.2,1);
  }
  .reveal.in-view{opacity:1; transform:translateY(0);}

  /* ===== Music toggle ===== */
  #music-toggle{
    position:fixed; right:22px; bottom:22px; z-index:60;
    width:52px; height:52px; border-radius:50%;
    background:var(--panel); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 12px 30px -14px rgba(0,0,0,0.6);
    transition:border-color .3s ease, box-shadow .3s ease;
  }
  #music-toggle:hover{border-color:var(--gold-soft); box-shadow:0 14px 34px -14px rgba(204,154,77,0.4);}
  #music-toggle svg{width:20px; height:20px; fill:var(--gold-soft);}
  #music-toggle .disc{
    position:absolute; inset:0; border-radius:50%;
    border:1px dashed var(--line);
  }
  #music-toggle.playing .disc{animation:spin 4s linear infinite;}
  #music-toggle .bars{display:flex; align-items:flex-end; gap:2px; height:14px;}
  #music-toggle .bars span{
    width:3px; background:var(--gold-soft); border-radius:2px; height:4px;
    transition:height .2s ease;
  }
  #music-toggle.playing .bars span{animation:eq 0.9s ease-in-out infinite;}
  #music-toggle.playing .bars span:nth-child(2){animation-delay:.15s;}
  #music-toggle.playing .bars span:nth-child(3){animation-delay:.3s;}
  @keyframes eq{
    0%,100%{ height:4px; }
    50%{ height:14px; }
  }

  /* ===== Tuyết rơi ===== */
  #snow-layer{
    position:fixed; inset:0; z-index:50;
    pointer-events:none; overflow:hidden;
  }
  .snowflake{
    position:absolute; top:-3vh;
    border-radius:50%;
    background:radial-gradient(circle, #ffffff 0%, rgba(255,255,255,0.5) 60%, rgba(255,255,255,0) 100%);
    animation-name:snow-fall, snow-sway;
    animation-timing-function:linear, ease-in-out;
    animation-iteration-count:infinite, infinite;
    animation-direction:normal, alternate;
    will-change:transform;
  }
  @keyframes snow-fall{
    from{ transform:translateY(-5vh); }
    to{ transform:translateY(105vh); }
  }
  @keyframes snow-sway{
    from{ margin-left:-18px; }
    to{ margin-left:18px; }
  }

</style>
</head>
<body>

<!-- Loading screen -->
<div id="site-loader">
  <div class="loader-inner">
    <div class="loader-mark">Kyanta</div>
    <div class="loader-ring"></div>
    <div class="loader-bar"></div>
    <div class="loader-sub">Đang tải...</div>
  </div>
</div>

<!-- Nhạc nền: cấu hình trong data.json (music.src) -->
<audio id="bgm" loop preload="none"></audio>

<button id="music-toggle" type="button" aria-label="Bật/tắt nhạc nền">
  <span class="disc"></span>
  <span class="bars"><span></span><span></span><span></span></span>
</button>

<div id="snow-layer"></div>

<div class="wrap" id="app">
  <!-- Nội dung được JS render tự động từ data.json -->
</div>

<script>
(function(){
  "use strict";

  function esc(s){
    if(s === undefined || s === null) return '';
    return String(s)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;');
  }

  function chapterHead(no, title){
    var h = '<div class="chapter-head"><span class="no">' + esc(no) + '</span>';
    if(title) h += '<h2>' + title + '</h2>';
    h += '<div class="rule"></div></div>';
    return h;
  }

  function renderApp(data){
    var wrap = document.getElementById('app');
    var html = '';

    // top bar
    html += '<div class="top"><div class="mark">' + esc(data.site.markLabel) +
      ' &nbsp;/&nbsp; <b>' + esc(data.site.markName) + '</b></div>' +
      '<div class="mark">' + esc(data.site.markRight) + '</div></div>';

    document.title = data.site.title || document.title;

    // hero
    var p = data.profile;
    html += '<section class="hero"><div class="avatar-box"><img src="' + esc(p.avatar) + '" alt="' + esc(p.avatarAlt) + '"></div>';
    html += '<div class="hero-text"><div class="eyebrow">' + esc(p.eyebrow) + '</div>';
    html += '<h1>' + esc(p.name) + '<small>' + esc(p.nameSmall) + '</small></h1>';
    html += '<p class="tagline">' + esc(p.tagline) + '</p>';
    html += '<div class="tags">' + (p.tags || []).map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>';
    html += '</div></section>';

    // intro
    html += chapterHead(data.intro.chapterNo);
    html += '<p style="color:var(--ink-dim); font-size:14.5px; max-width:640px;">' + esc(data.intro.text) + '</p>';

    // products section
    var ps = data.productsSection;
    html += chapterHead(ps.chapterNo, esc(ps.title));
    html += '<div class="tab-nav">' +
      '<button class="tab-btn" data-tab="tab-design" onclick="switchTab(\'tab-design\', this)">Thiết kế Banner</button>' +
      '<button class="tab-btn" data-tab="tab-sites" onclick="switchTab(\'tab-sites\', this)">Trang web (Vibe Code)</button>' +
      '</div>';

    html += '<div id="tab-design" class="tab-panel"><div class="gallery">';
    (ps.gallery || []).forEach(function(g){
      html += '<div class="gallery-item photo"><img src="' + esc(g.url) + '" alt="' + esc(g.alt) + '" loading="lazy">' +
        '<div class="gallery-cap">' + esc(g.caption) + '</div></div>';
    });
    html += '</div>';
    if(ps.designGalleryNote){
      html += '<p style="margin-top:14px; font-size:11.5px; color:var(--ink-dim); font-family:\'JetBrains Mono\',monospace;">' + esc(ps.designGalleryNote) + '</p>';
    }
    html += '</div>';

    html += '<div id="tab-sites" class="tab-panel"><div class="site-grid">';
    (ps.sites || []).forEach(function(s){
      html += '<a class="site-card" href="' + esc(s.href) + '" target="_blank" rel="noopener">' +
        '<div class="browser-bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>' +
        '<span class="url">' + esc(s.urlText) + '</span></div>' +
        '<div class="site-preview"><img src="' + esc(s.preview) + '" alt="preview ' + esc(s.urlText) + '" loading="lazy"></div>' +
        '<div class="site-info"><h3>' + esc(s.title) + '</h3><p>' + esc(s.desc) + '</p></div></a>';
    });
    html += '</div></div>';

    // projects section
    var pj = data.projectsSection;
    html += chapterHead(pj.chapterNo, esc(pj.title));
    html += '<div class="worklist">';
    (pj.items || []).forEach(function(it){
      html += '<div class="work"><h3>' + esc(it.title) + '</h3><p>' + esc(it.desc) + '</p><span class="role">' + esc(it.role) + '</span></div>';
    });
    html += '</div>';

    // servers section
    var sv = data.serversSection;
    html += chapterHead(sv.chapterNo, esc(sv.title));
    html += '<div class="worklist">';
    (sv.items || []).forEach(function(it){
      html += '<div class="work"><h3>' + esc(it.title) + '</h3><p>' + esc(it.desc) + '</p><span class="role">' + esc(it.role) + '</span></div>';
    });
    html += '</div>';

    // social section
    var so = data.socialSection;
    html += chapterHead(so.chapterNo, esc(so.title));
    html += '<div class="links">';
    (so.items || []).forEach(function(it){
      html += '<a class="link-card" href="' + esc(it.href) + '" target="_blank" rel="noopener">' +
        '<div class="platform">' + esc(it.platform) + '</div>' +
        '<div class="handle">' + esc(it.handle) + '</div>' +
        '<div class="desc">' + esc(it.desc) + '</div></a>';
    });
    html += '</div>';

    // contact section
    var co = data.contactSection;
    html += chapterHead(co.chapterNo, esc(co.title));
    html += '<div class="links">';
    (co.items || []).forEach(function(it){
      html += '<a class="link-card" href="' + esc(it.href) + '">' +
        '<div class="platform">' + esc(it.platform) + '</div>' +
        '<div class="handle">' + esc(it.handle) + '</div>' +
        '<div class="desc">' + esc(it.desc) + '</div></a>';
    });
    html += '</div>';

    // footer
    html += '<footer><span>' + esc(data.footer.text) + '</span><span></span></footer>';

    wrap.innerHTML = html;

    // music
    var bgm = document.getElementById('bgm');
    if(data.music && data.music.src){
      var src = document.createElement('source');
      src.src = data.music.src;
      src.type = 'audio/mpeg';
      bgm.appendChild(src);
    }
  }

  function switchTab(tabId, btn){
    var alreadyOpen = btn.classList.contains('active');
    document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    if(!alreadyOpen){
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }
  }
  window.switchTab = switchTab;

  /* ===== Loading screen ===== */
  var loader = document.getElementById('site-loader');
  var minLoadTime = 1200;
  var start = Date.now();

  function hideLoader(){
    var elapsed = Date.now() - start;
    var wait = Math.max(0, minLoadTime - elapsed);
    setTimeout(function(){
      loader.classList.add('hide');
      document.body.classList.add('entered');
      initReveal();
      tryPlayMusic();
    }, wait);
  }

  /* ===== Nhạc nền ===== */
  var bgm = document.getElementById('bgm');
  var musicBtn = document.getElementById('music-toggle');
  bgm.volume = 1;

  function tryPlayMusic(){
    var playPromise = bgm.play();
    if(playPromise !== undefined){
      playPromise.then(function(){
        musicBtn.classList.add('playing');
      }).catch(function(){
        var startOnce = function(){
          bgm.play().then(function(){ musicBtn.classList.add('playing'); }).catch(function(){});
          document.removeEventListener('click', startOnce);
          document.removeEventListener('keydown', startOnce);
          document.removeEventListener('touchstart', startOnce);
        };
        document.addEventListener('click', startOnce, { once:true });
        document.addEventListener('keydown', startOnce, { once:true });
        document.addEventListener('touchstart', startOnce, { once:true });
      });
    }
  }

  musicBtn.addEventListener('click', function(){
    if(bgm.paused){
      bgm.play().then(function(){ musicBtn.classList.add('playing'); }).catch(function(){});
    } else {
      bgm.pause();
      musicBtn.classList.remove('playing');
    }
  });

  /* ===== Hiệu ứng xuất hiện khi cuộn trang ===== */
  function initReveal(){
    var targets = document.querySelectorAll('.chapter-head, .work, .site-card, .link-card, .gallery-item, .tagline, .tags, section.hero');
    targets.forEach(function(el, i){
      el.classList.add('reveal');
      el.style.transitionDelay = (Math.min(i % 6, 6) * 0.06) + 's';
    });

    var observer = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('in-view');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

    targets.forEach(function(el){ observer.observe(el); });
  }

  /* ===== Tuyết rơi ===== */
  (function initSnow(){
    var layer = document.getElementById('snow-layer');
    var count = window.innerWidth < 640 ? 26 : 46;
    for(var i = 0; i < count; i++){
      var flake = document.createElement('div');
      flake.className = 'snowflake';
      var size = (Math.random() * 3.5 + 1.5).toFixed(1);
      var left = (Math.random() * 100).toFixed(2);
      var fallDuration = (Math.random() * 9 + 8).toFixed(1);
      var swayDuration = (Math.random() * 3 + 2.5).toFixed(1);
      var delay = (Math.random() * -20).toFixed(1);
      var opacity = (Math.random() * 0.5 + 0.35).toFixed(2);

      flake.style.left = left + 'vw';
      flake.style.width = size + 'px';
      flake.style.height = size + 'px';
      flake.style.opacity = opacity;
      flake.style.animationDuration = fallDuration + 's, ' + swayDuration + 's';
      flake.style.animationDelay = delay + 's, ' + delay + 's';

      layer.appendChild(flake);
    }
  })();

  // ===== Load data.json và render =====
  fetch('data.json', { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(data){
      renderApp(data);
      if(document.readyState === 'complete'){ hideLoader(); }
      else{ window.addEventListener('load', hideLoader); }
    })
    .catch(function(err){
      document.getElementById('app').innerHTML = '<p style="padding:40px;color:#e88;">Không tải được data.json: ' + esc(err.message) + '</p>';
      hideLoader();
    });

})();
</script>
</body>
</html>
